[package]
name = "soil-data-access"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["form", "json", "http1", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sqlparser = "=0.64.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
